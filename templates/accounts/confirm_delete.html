{% extends 'base.html' %}
{% block content %}
<style>
    .delete-unified-box {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 24px;
        margin: 24px auto 100px auto;
        width: calc(100% - 24px);
        max-width: 600px;
        direction: rtl;
        font-family: inherit;
    }

    .delete-header-top {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 24px;
        padding-bottom: 16px;
        border-bottom: 1px solid var(--border);
    }

    .btn-back {
        background: var(--input-bg);
        color: var(--text-main);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        transition: 0.2s;
        border: 1px solid var(--border);
    }

    .btn-back:hover {
        background: var(--icon-bg-hover);
    }

    .delete-title {
        font-size: 16px;
        font-weight: 800;
        color: var(--text-main);
        margin: 0;
        font-family: inherit;
    }

    .danger-card {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid var(--danger);
        padding: 24px;
        border-radius: 16px;
        text-align: center;
    }

    .danger-icon {
        width: 48px;
        height: 48px;
        margin-bottom: 15px;
    }

    .danger-heading {
        color: var(--danger);
        font-size: 16px;
        margin: 0 0 10px 0;
        font-weight: 700;
        font-family: inherit;
    }

    .danger-desc {
        color: var(--text-main);
        font-size: 13px;
        margin: 0 0 24px 0;
        line-height: 1.6;
        font-family: inherit;
    }

    .actions-row {
        display: flex;
        gap: 10px;
        justify-content: center;
        max-width: 320px;
        margin: 0 auto;
    }

    .btn-cancel {
        flex: 1;
        background: var(--input-bg);
        color: var(--text-main);
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
        font-family: inherit;
    }

    .btn-cancel:hover {
        background: var(--icon-bg-hover);
    }

    .btn-confirm-delete {
        flex: 1;
        background: var(--danger);
        color: #fff;
        border: none;
        padding: 12px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        transition: 0.2s;
        font-family: inherit;
    }

    .btn-confirm-delete:hover {
        opacity: 0.9;
    }
</style>

<div class="delete-unified-box">
    <div class="delete-header-top">
        <a href="{% url 'profile_edit' %}" class="btn-back">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        </a>
        <h2 class="delete-title">تایید حذف آیتم</h2>
    </div>

    <div class="danger-card">
        <svg class="danger-icon" viewBox="0 0 24 24" fill="none" stroke="var(--danger)" stroke-width="2">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
            <line x1="12" y1="9" x2="12" y2="13"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
        <h3 class="danger-heading">آیا از حذف این مورد اطمینان دارید؟</h3>
        <p class="danger-desc">این رکورد پس از تایید به صورت کامل از رزومه شما حذف شده و این عملیات غیرقابل بازگشت خواهد بود.</p>
        
        <form method="post" class="actions-row">
            {% csrf_token %}
            <a href="{% url 'profile_edit' %}" class="btn-cancel">انصراف</a>
            <button type="submit" class="btn-confirm-delete">بله، حذف کن</button>
        </form>
    </div>
</div>
{% endblock %}
