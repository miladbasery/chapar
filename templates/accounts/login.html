{% extends 'base.html' %}
{% block content %}
<div class="header">ورود به حساب کاربری</div>
<div class="compose-box" style="padding: 30px 20px;">
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">نام کاربری</label>
            <input type="text" name="username" class="form-control" required autofocus>
        </div>
        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">رمز عبور</label>
            <input type="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn" style="width:100%; margin-top:10px;">ورود</button>
    </form>
    <div style="margin-top:20px; text-align:center; font-size:14px; color:var(--text-muted);">
        حساب کاربری ندارید؟ <a href="{% url 'register' %}">ثبت‌نام کنید</a>
    </div>
</div>
{% endblock %}
