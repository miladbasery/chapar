{% extends 'base.html' %}
{% block content %}
<div class="header">
    <a href="{% url 'profile_detail_me' %}" style="margin-left: 15px;">←</a>
    ویرایش اطلاعات پروفایل
</div>
<div class="compose-box" style="padding: 25px 20px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div style="display:flex; gap:15px; margin-bottom:15px;">
            <div class="form-group" style="flex:1;">
                <label style="display:block; margin-bottom:8px; color:var(--text-muted);">نام</label>
                <input type="text" name="first_name" class="form-control" value="{{ form.first_name.value|default:'' }}">
            </div>
            <div class="form-group" style="flex:1;">
                <label style="display:block; margin-bottom:8px; color:var(--text-muted);">نام خانوادگی</label>
                <input type="text" name="last_name" class="form-control" value="{{ form.last_name.value|default:'' }}">
            </div>
        </div>

        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">برچسب / هویت تخصصی</label>
            <select name="stack_choice" class="form-control">
                <option value="">انتخاب کنید...</option>
                {% for k, v in form.fields.stack_choice.choices %}
                    <option value="{{ k }}" {% if form.stack_choice.value == k %}selected{% endif %}>{{ v }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">ایمیل</label>
            <input type="email" name="email" class="form-control" value="{{ form.email.value|default:'' }}">
        </div>

        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">درباره من / خلاصه رزومه</label>
            <textarea name="summary" class="form-control" rows="4">{{ form.summary.value|default:'' }}</textarea>
        </div>

        <div style="display:flex; gap:15px; margin-bottom:15px;">
            <div class="form-group" style="flex:1;">
                <label style="display:block; margin-bottom:8px; color:var(--text-muted);">گیت‌هاب</label>
                <input type="url" name="github" class="form-control" value="{{ form.github.value|default:'' }}">
            </div>
            <div class="form-group" style="flex:1;">
                <label style="display:block; margin-bottom:8px; color:var(--text-muted);">لینکدین</label>
                <input type="url" name="linkedin" class="form-control" value="{{ form.linkedin.value|default:'' }}">
            </div>
        </div>

        <div class="form-group">
            <label style="display:block; margin-bottom:8px; color:var(--text-muted);">تصویر نمایه (فشرده‌سازی خودکار انجام می‌شود)</label>
            <input type="file" name="photo" accept="image/*" class="form-control">
        </div>

        <button type="submit" class="btn" style="width:100%; margin-top:10px;">ذخیره اطلاعات</button>
    </form>
</div>
{% endblock %}
