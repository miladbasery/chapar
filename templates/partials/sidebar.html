<div id="sidebarOverlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 1001; transition: 0.3s;"></div>
<aside id="sidebar" style="position: fixed; top: 0; right: -320px; width: 280px; height: 100%; background: var(--modal-bg); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border-left: 1px solid var(--glass-border); z-index: 1002; transition: right 0.4s cubic-bezier(0.16, 1, 0.3, 1); display: flex; flex-direction: column; padding: 24px; direction: rtl; box-shadow: -10px 0 40px rgba(0,0,0,0.1);">
    <div style="font-size: 24px; font-weight: 800; color: var(--text-main); margin-bottom: 40px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 10px;">
            <img src="/static/logo/logo2.png" style="width: 32px; height: 32px; border-radius: 50%;">
            <span>چاپار</span>
        </div>
        <button id="closeSidebar" style="background: transparent; border: none; color: var(--text-main); cursor: pointer; padding: 5px; display: flex; border-radius: 50%;" onmouseover="this.style.background='var(--icon-bg-hover)'" onmouseout="this.style.background='transparent'">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
    </div>
    <nav style="display: flex; flex-direction: column; gap: 10px; flex: 1;">
        <button id="themeToggleMobile" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-size: 15px; font-weight: 500; color: var(--text-main); background: transparent; border: 1px solid transparent; border-radius: 18px; cursor: pointer; text-align: right; font-family: inherit; transition: 0.2s;" onmouseover="this.style.background='var(--icon-bg-hover)'; this.style.borderColor='var(--glass-border-hover)';" onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <span>تغییر پوسته</span>
        </button>
        <a href="/about/" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-size: 15px; font-weight: 500; color: var(--text-main); background: transparent; border: 1px solid transparent; border-radius: 18px; cursor: pointer; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background='var(--icon-bg-hover)'; this.style.borderColor='var(--glass-border-hover)';" onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>
            <span>درباره ما</span>
        </a>
        <div style="height: 1px; background: var(--glass-border); margin: 10px 0;"></div>
        {% if request.user.is_authenticated %}
        <form action="{% url 'logout' %}" method="post" style="margin: 0;">
            {% csrf_token %}
            <button type="submit" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-size: 15px; font-weight: 600; color: var(--danger); background: rgba(244, 33, 46, 0.08); border: 1px solid transparent; border-radius: 18px; cursor: pointer; text-align: right; width: 100%; font-family: inherit; transition: 0.2s;" onmouseover="this.style.background='rgba(244, 33, 46, 0.15)'; this.style.borderColor='rgba(244, 33, 46, 0.3)';" onmouseout="this.style.background='rgba(244, 33, 46, 0.08)'; this.style.borderColor='transparent';">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                <span>خروج از حساب</span>
            </button>
        </form>
        {% else %}
        <a href="{% url 'login' %}" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-size: 15px; font-weight: 500; color: var(--text-main); background: transparent; border: 1px solid transparent; border-radius: 18px; cursor: pointer; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background='var(--icon-bg-hover)'; this.style.borderColor='var(--glass-border-hover)';" onmouseout="this.style.background='transparent'; this.style.borderColor='transparent';">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            <span>ورود به حساب</span>
        </a>
        <a href="{% url 'register' %}" style="display: flex; align-items: center; gap: 14px; padding: 14px 18px; font-size: 15px; font-weight: 600; color: var(--accent); background: rgba(29, 155, 240, 0.1); border: 1px solid transparent; border-radius: 18px; cursor: pointer; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background='rgba(29, 155, 240, 0.2)'; this.style.borderColor='rgba(29, 155, 240, 0.3)';" onmouseout="this.style.background='rgba(29, 155, 240, 0.1)'; this.style.borderColor='transparent';">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="8.5" cy="7.5" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
            <span>ثبت‌نام</span>
        </a>
        {% endif %}
    </nav>
</aside>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const menuToggle = document.getElementById('menuToggle');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    const sidebarOverlay = document.getElementById('sidebarOverlay');

    // تابع باز کردن سایدبار
    function openSidebar() {
        sidebar.style.right = '0';
        sidebarOverlay.style.display = 'block';
    }

    // تابع بستن سایدبار
    function hideSidebar() {
        sidebar.style.right = '-320px';
        sidebarOverlay.style.display = 'none';
    }

    // اتصال رویداد کلیک به دکمه‌ها
    if (menuToggle) menuToggle.addEventListener('click', openSidebar);
    if (closeSidebar) closeSidebar.addEventListener('click', hideSidebar);
    
    // بسته شدن سایدبار با کلیک روی فضای تاریک بیرون آن (Overlay)
    if (sidebarOverlay) sidebarOverlay.addEventListener('click', hideSidebar);
});
</script>
