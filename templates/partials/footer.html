<style>
    .glass-dock {
        position: fixed;
        z-index: 1000;
        background: var(--glass-bg, rgba(22, 24, 28, 0.75));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.08));
        display: flex;
        box-shadow: var(--shadow-base, 0 10px 40px rgba(0, 0, 0, 0.4));
        direction: rtl;
        align-items: center;
        justify-content: space-around;
        transition: 0.3s;
    }
    .glass-dock a {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted, #71767b);
        transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        text-decoration: none;
    }
    .glass-dock a:hover {
        color: var(--text-main, #e7e9ea);
        transform: translateY(-2px) scale(1.05);
    }
    .glass-dock a.compose-btn-solid {
        color: var(--accent, #1d9bf0);
        background: transparent !important;
        padding: 0 !important;
    }
    .glass-dock a.compose-btn-solid svg {
        fill: var(--accent, #1d9bf0);
        transition: 0.2s;
    }
    .glass-dock a.compose-btn-solid:hover svg {
        fill: var(--accent-hover, #1a8cd8);
        transform: scale(1.08);
    }

    @media (max-width: 768px) {
        .glass-dock {
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 48px);
            max-width: 420px;
            flex-direction: row;
            padding: 12px 16px;
            border-radius: 9999px;
        }
        .glass-dock a {
            padding: 8px;
        }
    }
    @media (min-width: 769px) {
        .glass-dock {
            top: 50%;
            right: 24px;
            transform: translateY(-50%);
            flex-direction: column;
            gap: 24px;
            padding: 24px 16px;
            border-radius: 40px;
        }
        .glass-dock a {
            padding: 14px;
            background: var(--glass-hover, rgba(255, 255, 255, 0.03));
            border-radius: 50%;
        }
        .glass-dock a:hover {
            background: var(--icon-bg-hover, rgba(255, 255, 255, 0.1));
        }
    }
</style>
